name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  # Fast, secret-free gate that protects every push/PR: formatting, compilation,
  # and the fork-free test suites (unit + security).
  build-test:
    name: fmt + build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check

      - name: Build (with contract sizes / EIP-170 check)
        run: forge build --sizes

      - name: Unit + security tests (no fork)
        run: forge test --match-path "test/{unit,security}/**" -vvv

  # Full suite against a mainnet fork. e2e/fork/integration/invariant tests reuse
  # the active fork from --fork-url, so they need an RPC endpoint. This job runs
  # only when the ETH_RPC_URL secret is configured and skips gracefully otherwise
  # (so forks/contributors without the secret don't get a red check).
  fork-test:
    name: fork tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Fork tests
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          if [ -z "$ETH_RPC_URL" ]; then
            echo "ETH_RPC_URL secret not set — skipping fork tests."
            exit 0
          fi
          forge test \
            --fork-url "$ETH_RPC_URL" \
            --match-path "test/{e2e,fork,integration,invariant}/**" \
            -vvv
