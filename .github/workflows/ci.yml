name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger: lets us force a run from the Actions UI or `gh workflow run CI`
  # when an automatic pull_request event is dropped (e.g. a GitHub Actions incident).
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  # Fast, secret-free gate that protects every push/PR: formatting, compilation,
  # and the fork-free test suites (unit + security).
  build-test:
    name: fmt + build + unit tests
    runs-on: ubuntu-latest
    # Not a fix for anything, and deliberately well above the ~25 minutes a cold via-IR
    # compile costs here. It exists so a job that stops making progress reports a cause.
    # A runner reclaimed mid-compile reports only `exit 143`, which reads like a build
    # failure and sends the next reader looking through the diff; a timeout at a number
    # someone chose says plainly that nothing finished in time.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # via-IR compilation of this codebase is memory-hungry: a cold build peaks near
      # 12GB, against a 2-core/7GB runner. Swap is what keeps solc alive long enough to
      # finish. Note that the failure it prevents is a SIGKILL (137) from the OOM killer;
      # it does not prevent, and has been misread as explaining, the SIGTERM (143) that
      # arrives when the runner itself is reclaimed. See the cache note below for that one.
      - name: Add swap space
        run: |
          # The runner already has a /swapfile; add a second, larger one on the
          # big /mnt scratch disk rather than colliding with the existing file.
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          swapon --show

      # Pinned rather than `stable`, because `forge fmt` is not stable across releases:
      # 1.8.0 changed the indentation of named struct arguments nested inside a chained
      # call, so a tree formatted by one release fails `--check` under the next. With a
      # moving version that break lands on whichever PR happens to run after the release,
      # which reads as a failure of that PR. Bump this deliberately, reformatting in the
      # same commit. Keep every install site in this repo and in koreth-v1-periphery on
      # the same version — their [fmt] settings are identical, so a mismatch is a red
      # check in one repo and not the other.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # Cache the Foundry build so only the first run pays the full via-IR cost.
      #
      # Shared with the fork job below, under one namespace. Same solc, same optimiser, same
      # profile — but that is not enough on its own, and assuming it was is what kept this job
      # dying. The two jobs do not compile the same set: `forge build` includes script/,
      # `forge test` does not. Measured on this tree, `forge build --sizes` against a cache
      # freshly written by `forge test` recompiles 199 files, while the reverse recompiles none.
      # The relation is containment, not equivalence.
      #
      # The cost is not the thirteen files in script/. Compilation is batched, so adding sources
      # to a batch recompiles the batch: the price of an entry missing script/ is the whole
      # project, not the difference between the two sets.
      #
      # Left alone, the asymmetry points the wrong way. actions/cache writes its entry in a
      # *post* step, which a job killed by a reclaimed runner never reaches — so the only job
      # reliably reaching its save was the fork job, the one compiling the *smaller* set. This
      # job could therefore never restore something it could use, paid a near-full via-IR
      # compile every run, and was killed part way through it; the entry that caused the long
      # compile survived the kill intact, and the next run restored it and died the same way.
      # Three kills at ~27 minutes across two branches, twelve seconds apart, each preserving
      # its own cause. Re-running is not a fix and cannot become one.
      #
      # The fix is in the fork job below, which now builds before it tests, so the job that
      # survives is the one saving the larger set. Restoring an exact hit here compiled 50
      # files and finished in 8m17s; the entry left by the smaller set compiled 120 and did
      # not finish at all.
      #
      # `forge-shared-` rather than reusing `forge-`, because restore-keys are tried in order
      # and the first prefix that matches wins even when a later one holds a fresher entry.
      # Reusing `forge-` would have matched the frozen entry on the very first run and
      # reproduced the failure this is fixing. A namespace with nothing in it falls straight
      # through to the entry main leaves behind.
      #
      # Restoring has a second dimension, and it outranks key order. A run searches its own
      # branch's caches first, and only when the branch scope yields nothing at all does it widen
      # to the branches it inherits from — for a pull request that is the base branch, and beyond
      # that the default branch. Scope is the outer loop; key order is the inner one. So an entry
      # on the current branch wins over an inherited one that is both strictly fresher and matched
      # by an earlier restore-key. Every PR here targets main, so base and default are the same
      # branch today; on a PR stacked on another branch, or targeting a release branch, they are
      # not, and the entry that decides the restore is the base branch's.
      #
      # That is why there is no compatibility fallback here. A second `forge-fork-` key looks
      # harmless once `forge-shared-` exists on main, and is not: a branch still carrying a
      # `forge-fork-` entry from before this change matches its own stale copy on the second key
      # instead of main's current one on the first — reinstating, per branch, exactly the freeze
      # this scheme removes. Observed rather than theorised: a PR restored a `forge-fork-` entry
      # written by its own earlier run in preference to a newer `forge-shared-` entry on main,
      # with `forge-shared-` listed first. A branch that matches nothing starts cold once and is
      # warm from then on, which is the cheaper failure.
      #
      # The practical consequence: which entry warms a run depends on whether the branch has
      # run before. A pull request's first run has nothing under its own ref and inherits the
      # entry main left behind; every run after that saves under the PR's ref and restores its
      # own, because scope is decided before key order. So reading the cache list and expecting
      # the newest key to win will mislead you, and so will assuming main's is the one in play.
      # Ask for the `ref=` that actually decides it:
      #   gh api --paginate repos/korethlabs/koreth-v1-core/actions/caches \
      #     --jq '.actions_caches[]|"\(.key) \(.created_at) ref=\(.ref)"'
      #
      # --paginate is not optional here. The endpoint returns 30 entries per page against a
      # `total_count` in the hundreds, and the omission is silent: the listing looks complete
      # and simply lacks the entry being hunted, which reads as "no such cache" — the wrong
      # conclusion, reached from a command that appeared to answer the question.
      - name: Cache forge build
        uses: actions/cache@v6
        with:
          path: |
            out
            cache
          # script/ is in the hash because it is in the cached set. Both jobs compile it, and
          # actions/cache skips its save on an exact key hit — so a commit touching only
          # script/ would match the existing key, publish nothing, and leave every later run
          # recompiling those files off a stale entry. The rule is that the key must cover
          # everything the entry contains, or the entry silently stops tracking part of itself.
          key: forge-shared-${{ runner.os }}-${{ hashFiles('src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'foundry.toml', 'remappings.txt') }}
          restore-keys: |
            forge-shared-${{ runner.os }}-

      - name: Check formatting
        run: forge fmt --check

      - name: Build (with contract sizes / EIP-170 check)
        run: forge build --sizes

      - name: Unit + security tests (no fork)
        run: forge test --match-path "test/{unit,security}/**" -vvv

  # Keeps exports/enums.json equal to what the Solidity AST says, because four
  # repositories branch on these ordinals and each re-types them by hand. Nothing else in
  # CI can see this: an ABI encodes an enum parameter as `uint8` and drops the member
  # names, so the subgraph's abi-drift job and the SDK's regenerate cleanly, diff cleanly
  # and pass while every label is wrong.
  #
  # Its own job rather than a step in build-test, because it shares nothing with that
  # job: a different Foundry profile, a different out directory, and no dependency on the
  # build cache the swap and cache steps above exist to protect. It compiles
  # src/interfaces alone — 11 files in about 20ms — so it reports in well under a minute
  # and gives a plainly separate red tick when the export goes stale.
  #
  # The job also enforces that the export is append-only, which is a separate property and
  # the one nothing else could ever catch. The check above compares the committed file to
  # a fresh regenerate — but whoever reorders an enum regenerates too, so afterwards the
  # two agree and this job, the subgraph's abi-drift and the SDK's type check are all
  # green, each comparing against the new ordering and each correct to. The reference for
  # append-only has to come from git, not from the working tree, which is what --baseline
  # supplies.
  enum-export:
    name: enum export is current and append-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Enough history to reach the previously published export. The default depth of
          # 1 would leave --baseline nothing to resolve, and the script exits non-zero
          # rather than treating that as "nothing published".
          fetch-depth: 0

      # Same pin as the jobs above. This one does not format or run tests, but a solc
      # version difference would change the AST this check is asserting against.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # Which commit counts as "already published" depends on the event, and getting it
      # wrong is silent rather than red. On a pull request it is the base branch's tip:
      # the version consumers are reading today. On a push to main it is where main was
      # beforehand — naming the branch there would compare the pushed commit against
      # itself and pass unconditionally, which is exactly the shape of green tick this
      # check exists to remove. Neither is left to resolve by luck: the base branch is
      # fetched explicitly, and an empty or unresolvable answer makes the script exit
      # non-zero instead of reporting that nothing was published.
      - name: Resolve the published baseline
        id: baseline
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            ref=FETCH_HEAD
          else
            # Empty on workflow_dispatch, which carries no previous-commit field.
            ref="${{ github.event.before }}"
            if [ -z "$ref" ] || ! git rev-parse --verify --quiet "$ref^{commit}" >/dev/null; then
              ref="HEAD^"
            fi
          fi
          echo "Comparing against $(git rev-parse "$ref")"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Its own step so a broken rule and a broken export are different red lines. The
      # rule is enforced against every consumer of this repo, so it gets its own positive
      # controls rather than being trusted because it is short.
      - name: Check the append-only rule itself
        run: python3 script/tools/gen_enums.py --selftest

      - name: Check exports/enums.json
        run: python3 script/tools/gen_enums.py --check --baseline "${{ steps.baseline.outputs.ref }}"

  # Full suite against a mainnet fork. e2e/fork/integration/invariant tests reuse
  # the active fork from --fork-url, so they need an RPC endpoint. Without the
  # ETH_RPC_URL secret this job fails rather than skipping; the step below says why.
  fork-test:
    name: fork tests
    runs-on: ubuntu-latest
    # Same reasoning as the build job: a chosen number that reports a cause, not a fix.
    # Higher because this job compiles and then runs the whole fork suite.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Fail rather than skip. A job that exits 0 without an endpoint publishes the same green
      # tick as one that ran all 314 tests, so a secret that quietly stops resolving — an expired
      # key, or one moved to an organisation whose plan never injects it into a private repository
      # — is indistinguishable from a passing build. That is not hypothetical: two consecutive
      # runs here reported success having executed no fork test at all, and it was caught only
      # because the job lasted a second. Both repositories are private with no forks, so there is
      # no outside contributor lacking the secret for a graceful skip to spare a red check.
      #
      # First in the job, and its own step rather than a line inside `Fork tests`, because the
      # build below now sits between the two. A minutes-long compile to reach a conclusion that
      # was available in a second is waste, and it is the only reason this moved.
      - name: Require ETH_RPC_URL
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          if [ -z "$ETH_RPC_URL" ]; then
            echo "::error::ETH_RPC_URL is not set, so the fork suite cannot run. Failing rather than reporting a green run that tested nothing."
            exit 1
          fi

      # Same via-IR memory problem as the build job: without headroom solc is killed mid-compile
      # before a single test runs, which reads like a test failure. That kill is a SIGKILL (137);
      # the swap prevents it. A SIGTERM (143) here means something else — see the shared cache note.
      - name: Add swap space
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      # Same version as build-test above. This job does not format, but it does the
      # via-IR compile, and a solc or optimiser difference between the two jobs would
      # mean the artifacts they cache are not interchangeable.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # One namespace with the build job, not a `forge-fork-` of its own. See the note there for
      # why, and for why there is no second restore key: this job survives, so it is the one that
      # keeps the shared entry current, and the build job stops inheriting whatever the last kill
      # left frozen. Keep this identical to the build job's — two jobs that restore differently
      # do not share a namespace, they take turns overwriting one.
      - name: Cache forge build
        uses: actions/cache@v6
        with:
          path: |
            out
            cache
          # script/ is in the hash because it is in the cached set. Both jobs compile it, and
          # actions/cache skips its save on an exact key hit — so a commit touching only
          # script/ would match the existing key, publish nothing, and leave every later run
          # recompiling those files off a stale entry. The rule is that the key must cover
          # everything the entry contains, or the entry silently stops tracking part of itself.
          key: forge-shared-${{ runner.os }}-${{ hashFiles('src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'foundry.toml', 'remappings.txt') }}
          restore-keys: |
            forge-shared-${{ runner.os }}-

      # Not this job's own requirement — the fork suite compiles fine without it. It is here
      # because this is the job that reaches its cache save, and what it saves is what the
      # build job above has to live with. `forge test` skips script/, so an entry written by
      # the tests alone leaves the build job a 199-file recompile it cannot afford; building
      # first makes the saved set the superset, and the build job's restore an exact hit.
      #
      # Cheap on this side by the same containment: everything the tests need is already in
      # what this compiles, so the `Fork tests` step below finds the artifacts present and
      # compiles nothing. The cost is the thirteen files in script/ on a warm entry, and on a
      # cold one it is a compile this job was going to pay anyway, moved earlier.
      #
      # --sizes rather than a plain build, so the two jobs issue the same command and cannot
      # drift into compiling different sets again. The EIP-170 check it prints is the build
      # job's to enforce; here it is only a byproduct of keeping the commands identical.
      - name: Build (so the cache this job saves covers script/ too)
        run: forge build --sizes

      # The suite reads mainnet at a pinned block, so the responses are identical every run and can
      # be replayed from disk. Without this each run pulls thousands of state slots live, which is
      # what was exhausting the provider and failing tests on timed-out reads.
      # Keyed on the forked block, because that is what the cached responses actually depend on.
      # Keying it on the test sources meant every test edit threw away the whole cache and sent the
      # suite back to fetching thousands of slots live, which is what the cache exists to prevent.
      - name: Resolve fork block
        id: forkblock
        run: |
          block=$(grep -oE 'FORK_BLOCK = [0-9_]+' test/helpers/ForkTestBase.sol | grep -oE '[0-9_]+$' | tr -d '_')
          test -n "$block" || { echo "FORK_BLOCK not found in ForkTestBase.sol"; exit 1; }
          echo "block=$block" >> "$GITHUB_OUTPUT"

      # Restore the newest snapshot for this block, then save a fresh one under a key no earlier run
      # can already hold. actions/cache skips its save step on an exact key hit, so a key derived
      # only from the block — a constant — is written once and never again: the entry keeps whatever
      # the suite happened to touch that day, and every slot reached by a test added afterwards is
      # fetched live on every run from then on. That is how a cache meant to prevent live reads ends
      # up guaranteeing them, and it is why the reads that time out are the ones belonging to the
      # most recently added pools. Suffixing the run id makes each save a miss, so the snapshot
      # accumulates rather than freezing.
      #
      # Split into restore and save so the save can be skipped when the suite did not run. A job
      # without ETH_RPC_URL exits before a single read, and saving there would publish whatever was
      # restored under a newer key — harmless in isolation, but two jobs that start together both
      # restore the same entry, and if the one that skipped saves last, its copy becomes the newest
      # prefix match and hides the one that actually ran. The snapshot would then shrink back
      # towards the frozen state this is undoing.
      - name: Restore fork RPC responses
        uses: actions/cache/restore@v6
        with:
          path: ~/.foundry/cache/rpc
          key: rpc-${{ runner.os }}-${{ steps.forkblock.outputs.block }}-${{ github.run_id }}
          # First prefix takes the newest rolling entry. Second is the key this scheme replaces,
          # which the first cannot match for want of its trailing separator — without it the run
          # that adopts the scheme starts cold and fetches the whole suite live, the failure being
          # fixed here. Its contents are still sound: the responses are reads of a pinned block, so
          # they cannot go out of date, only fall behind what the suite now touches. Kept separate
          # rather than dropping the separator from the first, which would also match a longer block
          # number that happens to start with this one.
          restore-keys: |
            rpc-${{ runner.os }}-${{ steps.forkblock.outputs.block }}-
            rpc-${{ runner.os }}-${{ steps.forkblock.outputs.block }}

      - name: Fork tests
        id: forktests
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          # The endpoint is guaranteed present by the `Require ETH_RPC_URL` step at the top of
          # this job, which is where the reasoning for failing rather than skipping lives.
          # Records that reads actually happened, so the save step below knows whether this job has
          # a snapshot worth publishing. Set before the suite runs, not after: a failing run has
          # still fetched everything it reached, and that is exactly what the next run should not
          # have to fetch again.
          echo "ran=true" >> "$GITHUB_OUTPUT"
          # Thousands of live state reads per run, so ride out a provider hiccup rather than
          # failing the suite on one dropped response.
          # Throttled below Foundry's 330 default: on a cold cache the suite opens enough parallel
          # state reads to trip the provider's rate limit, and a throttled request that times out
          # costs far more than a slower one that succeeds.
          forge test \
            --fork-url "$ETH_RPC_URL" \
            --match-path "test/{e2e,fork,integration,invariant}/**" \
            --fork-retries 5 --fork-retry-backoff 3 \
            --compute-units-per-second 150 \
            -vvv

      # Only `main` writes the snapshot, which is the opposite of the usual instinct — normally
      # every run should contribute. It inverts here because restoring has a dimension besides key
      # order, and that dimension outranks it: a run searches its own branch's caches first and
      # consults the default branch only if the branch scope yields nothing at all. So a branch
      # that has ever saved will prefer its own entry forever, however thin, over main's however
      # fat. These entries are not interchangeable copies of one thing — they differ in coverage,
      # and a thin entry that wins on scope is strictly worse than a fat one that loses on it.
      #
      # Observed, not inferred. On PR #52 four fork suites failed in `setUp()` with `vm.rollFork:
      # could not instantiate forked environment … operation timed out`. The branch had restored
      # its own 09:07 snapshot rather than main's fresher one, so it had to fetch far more live
      # and tripped the provider. The provider was not flaky in isolation; the cache steered the
      # branch to the thinner snapshot.
      #
      # Letting only main write means a PR branch has nothing of its own to prefer and falls
      # through to main's, which is the richest that exists because every merge runs the full
      # suite against it. PR runs still restore — they just stop writing an entry that would
      # shadow a better one.
      #
      # Safe because the snapshot is purely accumulative: the responses are reads of a pinned
      # block, so an entry can be incomplete but never wrong, and a fatter one is strictly
      # better with no invalidation case. `FORK_BLOCK` moving does not leak staleness in either,
      # since the block appears both in the cache key and inside the file's own
      # `meta.block_env.number` — a bumped block simply stops matching rather than shadowing.
      #
      # Branches that already hold an entry from before this change keep preferring it until it
      # is evicted. That self-corrects and is not worth deleting caches over.
      #
      # always(), so a failed run on main still publishes what it fetched. Its reads stand on
      # their own regardless of what the assertions concluded.
      - name: Save fork RPC responses
        if: always() && steps.forktests.outputs.ran == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.foundry/cache/rpc
          key: rpc-${{ runner.os }}-${{ steps.forkblock.outputs.block }}-${{ github.run_id }}
