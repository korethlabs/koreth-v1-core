name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger: lets us force a run from the Actions UI or `gh workflow run CI`
  # when an automatic pull_request event is dropped (e.g. a GitHub Actions incident).
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  # Fast, secret-free gate that protects every push/PR: formatting, compilation,
  # and the fork-free test suites (unit + security).
  build-test:
    name: fmt + build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # via-IR compilation of this codebase is memory-hungry; the 2-core/7GB
      # runner OOMs without extra headroom. Add swap so solc doesn't get killed.
      - name: Add swap space
        run: |
          # The runner already has a /swapfile; add a second, larger one on the
          # big /mnt scratch disk rather than colliding with the existing file.
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          swapon --show

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # Cache the Foundry build so only the first run pays the full via-IR cost.
      - name: Cache forge build
        uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-${{ runner.os }}-${{ hashFiles('src/**/*.sol', 'test/**/*.sol', 'foundry.toml', 'remappings.txt') }}
          restore-keys: forge-${{ runner.os }}-

      - name: Check formatting
        run: forge fmt --check

      - name: Build (with contract sizes / EIP-170 check)
        run: forge build --sizes

      - name: Unit + security tests (no fork)
        run: forge test --match-path "test/{unit,security}/**" -vvv

  # Full suite against a mainnet fork. e2e/fork/integration/invariant tests reuse
  # the active fork from --fork-url, so they need an RPC endpoint. This job runs
  # only when the ETH_RPC_URL secret is configured and skips gracefully otherwise
  # (so forks/contributors without the secret don't get a red check).
  fork-test:
    name: fork tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same via-IR memory problem as the build job: without headroom solc is killed mid-compile
      # and the job dies with exit 143 before a single test runs, which reads like a test failure.
      - name: Add swap space
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache forge build
        uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-fork-${{ runner.os }}-${{ hashFiles('src/**/*.sol', 'test/**/*.sol', 'foundry.toml', 'remappings.txt') }}
          restore-keys: forge-fork-${{ runner.os }}-

      # The suite reads mainnet at a pinned block, so the responses are identical every run and can
      # be replayed from disk. Without this each run pulls thousands of state slots live, which is
      # what was exhausting the provider and failing tests on timed-out reads.
      # Keyed on the forked block, because that is what the cached responses actually depend on.
      # Keying it on the test sources meant every test edit threw away the whole cache and sent the
      # suite back to fetching thousands of slots live, which is what the cache exists to prevent.
      - name: Resolve fork block
        id: forkblock
        run: |
          block=$(grep -oE 'FORK_BLOCK = [0-9_]+' test/helpers/ForkTestBase.sol | grep -oE '[0-9_]+$' | tr -d '_')
          test -n "$block" || { echo "FORK_BLOCK not found in ForkTestBase.sol"; exit 1; }
          echo "block=$block" >> "$GITHUB_OUTPUT"

      # Restore the newest snapshot for this block, then save a fresh one under a key no earlier run
      # can already hold. actions/cache skips its save step on an exact key hit, so a key derived
      # only from the block — a constant — is written once and never again: the entry keeps whatever
      # the suite happened to touch that day, and every slot reached by a test added afterwards is
      # fetched live on every run from then on. That is how a cache meant to prevent live reads ends
      # up guaranteeing them, and it is why the reads that time out are the ones belonging to the
      # most recently added pools. Suffixing the run id makes each save a miss, so the snapshot
      # accumulates rather than freezing.
      #
      # Split into restore and save so the save can be skipped when the suite did not run. A job
      # without ETH_RPC_URL exits before a single read, and saving there would publish whatever was
      # restored under a newer key — harmless in isolation, but two jobs that start together both
      # restore the same entry, and if the one that skipped saves last, its copy becomes the newest
      # prefix match and hides the one that actually ran. The snapshot would then shrink back
      # towards the frozen state this is undoing.
      - name: Restore fork RPC responses
        uses: actions/cache/restore@v4
        with:
          path: ~/.foundry/cache/rpc
          key: rpc-${{ runner.os }}-${{ steps.forkblock.outputs.block }}-${{ github.run_id }}
          # First prefix takes the newest rolling entry. Second is the key this scheme replaces,
          # which the first cannot match for want of its trailing separator — without it the run
          # that adopts the scheme starts cold and fetches the whole suite live, the failure being
          # fixed here. Its contents are still sound: the responses are reads of a pinned block, so
          # they cannot go out of date, only fall behind what the suite now touches. Kept separate
          # rather than dropping the separator from the first, which would also match a longer block
          # number that happens to start with this one.
          restore-keys: |
            rpc-${{ runner.os }}-${{ steps.forkblock.outputs.block }}-
            rpc-${{ runner.os }}-${{ steps.forkblock.outputs.block }}

      - name: Fork tests
        id: forktests
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          if [ -z "$ETH_RPC_URL" ]; then
            echo "ETH_RPC_URL secret not set — skipping fork tests."
            exit 0
          fi
          # Records that reads actually happened, so the save step below knows whether this job has
          # a snapshot worth publishing. Set before the suite runs, not after: a failing run has
          # still fetched everything it reached, and that is exactly what the next run should not
          # have to fetch again.
          echo "ran=true" >> "$GITHUB_OUTPUT"
          # Thousands of live state reads per run, so ride out a provider hiccup rather than
          # failing the suite on one dropped response.
          # Throttled below Foundry's 330 default: on a cold cache the suite opens enough parallel
          # state reads to trip the provider's rate limit, and a throttled request that times out
          # costs far more than a slower one that succeeds.
          forge test \
            --fork-url "$ETH_RPC_URL" \
            --match-path "test/{e2e,fork,integration,invariant}/**" \
            --fork-retries 5 --fork-retry-backoff 3 \
            --compute-units-per-second 150 \
            -vvv

      # always(), so a failed suite still publishes what it fetched. Its reads are of a pinned
      # block and stand on their own regardless of what the assertions concluded.
      - name: Save fork RPC responses
        if: always() && steps.forktests.outputs.ran == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.foundry/cache/rpc
          key: rpc-${{ runner.os }}-${{ steps.forkblock.outputs.block }}-${{ github.run_id }}
